<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>求职作战台 · 同步助手</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <header class="app-header">
    <div>
      <strong>求职作战台</strong>
      <span>投递同步助手 v0.2</span>
    </div>
    <div class="header-actions">
      <button type="button" class="btn ghost small dock-btn" id="dockBtn" hidden title="把插件常驻到当前页面（气泡/抽屉，可拖动）">常驻本页</button>
      <div id="sessionChip" class="chip chip-muted">未登录</div>
    </div>
  </header>

  <!-- 登录区 -->
  <section id="authSection" class="section">
    <form id="loginForm" class="stack">
      <label>邮箱（与作战台同一账号）
        <input id="loginEmail" type="email" autocomplete="username" placeholder="you@example.com" />
      </label>
      <label>密码
        <input id="loginPassword" type="password" autocomplete="current-password" placeholder="••••••••" />
      </label>
      <button type="submit" class="btn primary" id="loginBtn">登录作战台账号</button>
      <p class="hint">只读写你自己账号在 Firestore 的数据（states/你的uid）；密钥不进插件。</p>
    </form>
    <div class="row" id="authedBar" hidden>
      <span class="muted" id="authedText"></span>
      <button type="button" class="btn ghost" id="signOutBtn">退出</button>
    </div>
    <p id="authError" class="error" hidden></p>
  </section>

  <main id="workspace" class="section" hidden>
    <!-- 新增投递 -->
    <section class="card">
      <div class="card-title">
        <h2>① 新增投递</h2>
        <button type="button" class="btn ghost small" id="extractBtn">从当前页提取</button>
      </div>
      <form id="addForm" class="stack">
        <div class="grid2">
          <label>公司 *
            <input id="fCompany" required placeholder="例：启林投资" />
          </label>
          <label>平台
            <select id="fPlatform"></select>
          </label>
        </div>
        <label>岗位
          <input id="fPosition" placeholder="量化研究员（2026 届）" />
        </label>
        <div class="grid2">
          <label>分层
            <select id="fTier"></select>
          </label>
          <label>状态
            <select id="fStatus"></select>
          </label>
        </div>
        <label>JD 描述（可选，<span id="jdChars">0</span>/3000）
          <textarea id="fJd" rows="4" maxlength="3000"></textarea>
        </label>
        <div class="grid2">
          <label>截止日
            <input id="fDeadline" type="date" />
          </label>
          <label>投递链接
            <input id="fUrl" placeholder="自动填入当前页链接" />
          </label>
        </div>
        <button type="submit" class="btn primary" id="addBtn">保存到作战台</button>
      </form>
    </section>

    <!-- 更新状态 -->
    <section class="card">
      <div class="card-title">
        <h2>② 更新状态</h2>
        <button type="button" class="btn ghost small" id="refreshListBtn">刷新</button>
      </div>
      <div class="stack">
        <label>云端投递记录
          <select id="candidateSel"><option value="">（加载中…）</option></select>
        </label>
        <div class="grid2">
          <label>推进到
            <select id="nextStatusSel"></select>
          </label>
          <div class="btn-wrap">
            <button type="button" class="btn primary" id="applyStatusBtn">应用状态</button>
          </div>
        </div>
        <p class="hint">状态变更会自动追加到该公司的「状态时间线」，用于作战台统计阶段耗时。</p>
      </div>
    </section>

    <!-- DOM 能力探测（P1 spike：确认 BOSS/猎聘 页面可读与可注入范围） -->
    <section class="card">
      <div class="card-title">
        <h2>③ DOM 能力探测</h2>
        <button type="button" class="btn ghost small" id="probeRunBtn">运行并复制</button>
      </div>
      <div class="stack">
        <p class="hint">当前标签页运行（需 BOSS直聘/猎聘 页面）。先只读跑一次；会话页可勾选注入测试（写入探针后立即清空，不会发送）。结果自动复制，直接粘贴回对话即可。</p>
        <label class="check-line"><input type="checkbox" id="probeWriteCb" /> 包含输入框注入测试（会话页用，写完即清空）</label>
        <textarea id="probeOut" class="probe-out" rows="7" readonly placeholder="探测结果将显示在这里"></textarea>
      </div>
    </section>

    <!-- ④ AI 写手（P1：打招呼语 / HR 回复建议，草稿确认后才填框） -->
    <section class="card">
      <div class="card-title">
        <h2>④ AI 写手</h2>
        <button type="button" class="btn ghost small" id="aiExtractBtn">从当前页抓取</button>
      </div>
      <div class="stack">
        <div class="grid2">
          <label>模式
            <select id="aiMode">
              <option value="greeting">打招呼语（JD × 简历）</option>
              <option value="reply">回复建议（HR 消息 × 简历）</option>
            </select>
          </label>
          <label>语气
            <select id="aiTone">
              <option value="quant">量化专业</option>
              <option value="concise">简洁礼貌</option>
              <option value="warm">热情主动</option>
            </select>
          </label>
        </div>
        <div class="grid2">
          <label>岗位<input id="aiPosition" placeholder="自动抓取或手填" /></label>
          <label>公司<input id="aiCompany" placeholder="可改（以页面标题为准）" /></label>
        </div>
        <label>简历版本（自动按岗位推荐）
          <select id="aiVersion"><option value="">（点击「从当前页抓取」或登录后加载）</option></select>
        </label>
        <div id="aiJdBlock">
          <label>JD 关键词（自动提取，可改）
            <textarea id="aiKeywords" rows="2" maxlength="800" placeholder="Golang / 推荐算法 / 机器学习…（不混入 JD 描述）"></textarea>
          </label>
          <label>JD 描述（自动抓取，已滤无关词，可改）
            <textarea id="aiJd" rows="5" maxlength="3000" placeholder="job_detail 页会自动抓取 JD 正文"></textarea>
          </label>
        </div>
        <div id="aiHrBlock" hidden>
          <label>HR 最新消息（自动抓取，抓不到请粘贴）
            <textarea id="aiHr" rows="3" maxlength="800" placeholder="例如：你好，有量化交易的实践基础吗？"></textarea>
          </label>
        </div>
        <button type="button" class="btn primary" id="aiGenBtn">生成 3 版草稿</button>
        <p id="aiNote" class="hint" hidden></p>
        <div id="aiDraftList"></div>
      </div>
    </section>

    <p id="result" class="result" hidden></p>
    <p class="footnote">数据写入的是你在 https://obs.jobhunt.top 的账号云端；网页端打开时会自动同步显示。</p>
  </main>

  <script src="config.js"></script>
  <script src="popup.js"></script>
</body>
</html>
